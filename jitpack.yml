# JitPack builds this repo from a tag: https://jitpack.io/#Referalli/referalli-android
# Same JDK and Gradle as CI (.github/workflows/ci.yml).
jdk:
  - openjdk17
install:
  - source "$HOME/.sdkman/bin/sdkman-init.sh" && sdk install gradle 8.14.3 && sdk use gradle 8.14.3 && gradle publishToMavenLocal -x test
