# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# On a bare version tag (0.2.0, the tag JitPack builds), build the Maven publication on GitHub's
# runners, attach a signed SLSA build-provenance attestation to every artifact, and put them on the
# GitHub Release. Verify a download with:
#   gh attestation verify <file> --repo Referalli/referalli-android
# (The v* tags stay reserved for the Maven Central release workflow.)
name: Artifacts

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk-android
      # The Kotlin SDK at the same tag, built alongside (the included build in settings.gradle.kts).
      - uses: actions/checkout@v4
        with:
          repository: referalli/referalli-kotlin
          ref: ${{ github.ref_name }}
          path: sdk-kotlin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: The tag must equal the project version
        working-directory: sdk-android
        run: |
          v=$(gradle --no-daemon -q properties | sed -n 's/^version: //p')
          test "$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - name: Build, test and stage the publication
        working-directory: sdk-android
        run: gradle --no-daemon build publishReleasePublicationToStagingRepository
      - name: Collect the artifacts
        run: |
          mkdir -p dist
          find sdk-android/build/staging -type f \( -name '*.jar' -o -name '*.aar' -o -name '*.pom' -o -name '*.module' \) -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: GitHub Release with the attested artifacts
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "referalli-android $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
