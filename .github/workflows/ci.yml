# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# Adopted from the WS4 package CI (packages/sdk-*/ci/workflows/ci.yml); this copy is canonical.
# The module sits at the mirror repo root. It builds against referalli-kotlin's source, checked
# out beside it, so a change to both SDKs is tested together before either is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: build, unit tests, lint, AAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk-android
      - uses: actions/checkout@v4
        with:
          repository: referalli/referalli-kotlin
          ref: main
          path: sdk-kotlin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build (compile, unit tests, lint)
        working-directory: sdk-android
        run: gradle --no-daemon build
      - name: Assemble release AAR
        working-directory: sdk-android
        run: gradle --no-daemon assembleRelease
      - name: Stage the Maven publication (unsigned dry run)
        working-directory: sdk-android
        run: gradle --no-daemon publishReleasePublicationToStagingRepository
      - name: AAR must not reference java.net.http in its own classes
        working-directory: sdk-android
        run: |
          AAR=$(ls build/outputs/aar/*-release.aar)
          mkdir -p /tmp/aar && unzip -o -q "$AAR" -d /tmp/aar
          if unzip -p /tmp/aar/classes.jar | strings | grep -q 'java/net/http'; then
            echo "classes.jar references java.net.http"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: referalli-android-aar
          path: |
            sdk-android/build/outputs/aar/*.aar
            sdk-android/build/staging/**
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: sdk-android/build/reports/**
