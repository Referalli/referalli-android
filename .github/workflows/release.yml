# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# Publishes the Android library to Maven Central (namespace com.referalli) when a vX.Y.Z tag is pushed
# (the monorepo's sync-mirrors.ts --tag does that). Maven Central has no OIDC publishing, so this
# uses repo secrets, in the "maven-central" environment:
#   CENTRAL_USERNAME / CENTRAL_PASSWORD  a Central Portal user token (central.sonatype.com → View Account → Generate User Token)
#   SIGNING_KEY                          ASCII-armored GPG private key (gpg --armor --export-secret-keys KEYID)
#   SIGNING_PASSWORD                     its passphrase
# Builds against the RELEASED com.referalli:referalli-kotlin from Maven Central (no sibling
# checkout here), so release referalli-kotlin first whenever Android needs a new tracker.
# The build stages signed artifacts into a Maven repository named "staging" under build/staging.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner ships the Android SDK (ANDROID_HOME); android-actions/setup-android fails on its sdkmanager.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -Rqs --include=build.gradle.kts -E "^version *= *\"$v\"" . || grep -Rqs --include=gradle.properties -E "^(version|VERSION_NAME) *= *$v$" .
      - name: Build, sign and stage
        run: |
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          $G --no-daemon build publishAllPublicationsToStagingRepository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - name: Upload the bundle to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle"
          for d in $(find . -path '*/build/staging' -type d); do cp -R "$d"/. "$bundle"/; done
          test -n "$(ls -A "$bundle")" || { echo "nothing staged under */build/staging"; exit 1; }
          cd "$bundle"
          find . -type f \( -name '*.jar' -o -name '*.aar' -o -name '*.pom' -o -name '*.module' \) -exec sh -c 'md5sum "$1" | cut -d" " -f1 > "$1.md5"; sha1sum "$1" | cut -d" " -f1 > "$1.sha1"' _ {} \;
          zip -qr "$RUNNER_TEMP/bundle.zip" .
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl -sSf -X POST "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=$GITHUB_REPOSITORY-$GITHUB_REF_NAME" \
            -H "Authorization: Bearer $token" -F "bundle=@$RUNNER_TEMP/bundle.zip"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
